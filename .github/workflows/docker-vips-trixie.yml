name: Build Docker VIPS Images (Trixie)

on:
  # Rebuild after the base images are published, so VIPS images always build
  # on the latest base (covers base Dockerfile changes and the weekly schedule).
  workflow_run:
    workflows: ["Build Docker Images (Trixie)"]
    types: [completed]
    branches: [main]
  # VIPS-only changes don't trigger the base workflow, so build them directly.
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.vips-ffi'
      - '.github/workflows/docker-vips-trixie.yml'
  pull_request:
    paths:
      - 'Dockerfile.vips-ffi'
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - '.github/workflows/docker-vips-trixie.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Native runners per architecture (no QEMU); create-manifests joins them.
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        # Only build PHP 8.4 and 8.5 on amd64 for PRs to speed up CI; build everything on main
        php-version: ${{ github.event_name == 'pull_request' && fromJSON('[8.4, 8.5]') || fromJSON('[8.2, 8.3, 8.4, 8.5]') }}
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64", "linux/arm64"]') }}
      fail-fast: false
    env:
      VIPS_TAG: php-${{ matrix.php-version }}-vips-ffi-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
    # Local registry used on PRs to hand the freshly built base image to the VIPS build
    services:
      registry:
        image: ghcr.io/distribution/distribution:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7

      # Log in before setting up Buildx, so pulling the BuildKit image from
      # Docker Hub is authenticated on main.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      # On PRs, build the base image from this PR instead of relying on a published
      # tag (which may be stale, or not exist yet for a newly added PHP version).
      - name: Build base image (PR only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: .
          push: true
          tags: localhost:5000/frankenpress:php-${{ matrix.php-version }}-trixie
          cache-from: type=gha,scope=linux/amd64-${{ matrix.php-version }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            DEBIAN_VERSION=trixie
          provenance: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: notglossy/frankenpress
          labels: |
            org.opencontainers.image.title=FrankenPress VIPS/FFI (PHP ${{ matrix.php-version }} Trixie)
            org.opencontainers.image.description=WordPress with VIPS and FFI running on FrankenPHP with Debian Trixie
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./Dockerfile.vips-ffi
          tags: |
            notglossy/frankenpress:${{ env.VIPS_TAG }}
            ghcr.io/${{ github.repository_owner }}/frankenpress:${{ env.VIPS_TAG }}
          cache-from: |
            type=gha,scope=vips-${{ matrix.platform }}-${{ matrix.php-version }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/frankenpress:${{ env.VIPS_TAG }}
          cache-to: type=gha,mode=max,scope=vips-${{ matrix.platform }}-${{ matrix.php-version }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            DEBIAN_VERSION=trixie
            ${{ github.event_name == 'pull_request' && format('BASE_IMAGE=localhost:5000/frankenpress:php-{0}-trixie', matrix.php-version) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}

      # Docker Scout applies DHI's VEX statements, so CVEs Docker has marked as not
      # affecting its patched packages aren't reported. Fork PRs have no Docker Hub
      # secrets, so they skip the scan.
      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ github.event_name == 'pull_request' && 'local://notglossy' || format('registry://ghcr.io/{0}', github.repository_owner) }}/frankenpress:${{ env.VIPS_TAG }}
          only-severities: critical,high
          summary: true
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fail on fixable critical vulnerabilities
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ github.event_name == 'pull_request' && 'local://notglossy' || format('registry://ghcr.io/{0}', github.repository_owner) }}/frankenpress:${{ env.VIPS_TAG }}
          only-severities: critical
          only-fixed: true
          exit-code: true
          summary: false
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          image="notglossy/frankenpress:${VIPS_TAG}"
          docker run --rm "$image" php -v | grep "PHP ${{ matrix.php-version }}"
          docker run --rm "$image" php -m | grep FFI
          docker run --rm "$image" frankenphp version
          docker run --rm "$image" wp --version
          docker run --rm "$image" ls -la /usr/src/wordpress | grep wp-config-docker.php
          # libvips is built from source into /usr/local; Debian's libvips (and the OpenEXR it links) must not be present
          docker run --rm --entrypoint bash "$image" -c 'test -e /usr/local/lib/libvips.so.42 && test -L /usr/lib/$(uname -m)-linux-gnu/libvips.so.42 && ! test -e /var/lib/dpkg/status.d/libvips42t64 && ! test -e /var/lib/dpkg/status.d/libopenexr-3-1-30'
          docker run --rm "$image" php -r '$f = FFI::cdef("int vips_init(const char *argv0); const char *vips_version_string(void);", "libvips.so.42"); if ($f->vips_init("php") !== 0) exit(1); echo "libvips ", $f->vips_version_string(), "\n";'

  # Joins the per-architecture images into the multi-arch tags users pull.
  create-manifests:
    if: github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifests
        run: |
          for repo in notglossy/frankenpress "ghcr.io/${{ github.repository_owner }}/frankenpress"; do
            tags=(-t "${repo}:php-${{ matrix.php-version }}-vips-ffi-trixie")
            if [ "${{ matrix.php-version }}" = "8.4" ]; then
              tags+=(-t "${repo}:vips-ffi-trixie" -t "${repo}:vips-ffi")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "${repo}:php-${{ matrix.php-version }}-vips-ffi-trixie-amd64" \
              "${repo}:php-${{ matrix.php-version }}-vips-ffi-trixie-arm64"
            docker buildx imagetools inspect "${repo}:php-${{ matrix.php-version }}-vips-ffi-trixie"
          done
