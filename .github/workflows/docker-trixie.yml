name: Build Docker Images (Trixie)

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - '.github/workflows/docker-trixie.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - 'php.ini'
      - '.github/workflows/docker-trixie.yml'
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 1 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        # Only build PHP 8.4 and 8.5 for PRs to speed up CI, build all versions for main branch
        php-version: ${{ github.event_name == 'pull_request' && fromJSON('[8.4, 8.5]') || fromJSON('[8.2, 8.3, 8.4, 8.5]') }}
        # Split platforms to use native runners (amd64 on x64, arm64 on ARM)
        platform: ${{ github.event_name == 'pull_request' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64", "linux/arm64"]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            notglossy/frankenpress
            ghcr.io/${{ github.repository_owner }}/frankenpress
          tags: |
            type=raw,value=php-${{ matrix.php-version }}-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: |
            org.opencontainers.image.title=FrankenPress (PHP ${{ matrix.php-version }} Trixie)
            org.opencontainers.image.description=WordPress running on FrankenPHP with Debian Trixie
            org.opencontainers.image.licenses=MIT
          flavor: |
            latest=false

      # Resolved here rather than in the Dockerfile, so a new WordPress release
      # changes the build-arg and with it the build cache key.
      - name: Resolve latest WordPress version
        id: wordpress
        run: |
          version="$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Unexpected WordPress version '${version}'"
            exit 1
          fi
          echo "WordPress ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: |
            type=gha,scope=${{ matrix.platform }}-${{ matrix.php-version }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/frankenpress:php-${{ matrix.php-version }}-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ matrix.php-version }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            DEBIAN_VERSION=trixie
            WORDPRESS_VERSION=${{ steps.wordpress.outputs.version }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            com.notglossy.wordpress.version=${{ steps.wordpress.outputs.version }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}

      # Docker Scout applies DHI's VEX statements, so CVEs Docker has marked as not
      # affecting its patched packages aren't reported. Fork PRs have no Docker Hub
      # secrets, so they skip the scan.
      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ github.event_name == 'pull_request' && 'local://notglossy' || format('registry://ghcr.io/{0}', github.repository_owner) }}/frankenpress:php-${{ matrix.php-version }}-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          only-severities: critical,high
          summary: true
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fail on fixable critical vulnerabilities
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ github.event_name == 'pull_request' && 'local://notglossy' || format('registry://ghcr.io/{0}', github.repository_owner) }}/frankenpress:php-${{ matrix.php-version }}-trixie-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          only-severities: critical
          only-fixed: true
          exit-code: true
          summary: false
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 php -v | grep "PHP ${{ matrix.php-version }}"
          docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 frankenphp version
          docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 wp --version
          docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 ls -la /usr/src/wordpress | grep wp-config-docker.php
          # PHP must start cleanly and load every extension (catches broken conf.d loaders)
          startup=$(docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 php -v 2>&1)
          echo "$startup"
          if echo "$startup" | grep -Ei 'warning|error'; then echo "PHP printed startup warnings"; exit 1; fi
          modules=$(docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 php -m)
          echo "$modules" | grep -qx 'Zend OPcache'
          exts="bcmath exif gd intl mysqli zip imagick memcached apcu redis igbinary msgpack"
          ${{ matrix.php-version < 8.5 && 'exts="$exts memcache"' || '' }}
          for ext in $exts; do
            echo "$modules" | grep -qix "$ext" || { echo "Missing extension: $ext"; exit 1; }
          done
          # Runs as the DHI nonroot user; runtime tools the entrypoint and Imagick need
          test "$(docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 id -u)" = 65532
          docker run --rm --entrypoint bash notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 -c 'awk "BEGIN{exit 0}" && gs --version'
          docker run --rm notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 php -r 'foreach (["JPEG", "PNG", "WEBP", "AVIF", "HEIC", "PDF"] as $f) { if (!Imagick::queryFormats($f)) { echo "Imagick missing $f\n"; exit(1); } }'

  create-manifests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        php-version: [8.2, 8.3, 8.4, 8.5]
    steps:
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest (Docker Hub)
        run: |
          docker buildx imagetools create \
            -t notglossy/frankenpress:php-${{ matrix.php-version }}-trixie \
            ${{ matrix.php-version == 8.4 && '-t notglossy/frankenpress:trixie -t notglossy/frankenpress:latest' || '' }} \
            notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 \
            notglossy/frankenpress:php-${{ matrix.php-version }}-trixie-arm64

      - name: Create multi-arch manifest (GHCR)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/frankenpress:php-${{ matrix.php-version }}-trixie \
            ${{ matrix.php-version == 8.4 && format('-t ghcr.io/{0}/frankenpress:trixie -t ghcr.io/{0}/frankenpress:latest', github.repository_owner) || '' }} \
            ghcr.io/${{ github.repository_owner }}/frankenpress:php-${{ matrix.php-version }}-trixie-amd64 \
            ghcr.io/${{ github.repository_owner }}/frankenpress:php-${{ matrix.php-version }}-trixie-arm64

      - name: Inspect image (Docker Hub)
        run: |
          docker buildx imagetools inspect notglossy/frankenpress:php-${{ matrix.php-version }}-trixie

      - name: Inspect image (GHCR)
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/frankenpress:php-${{ matrix.php-version }}-trixie

  # Publishes shields.io endpoint badges with the PHP version actually built
  # into each published image. The JSON files live on the `badges` branch, so
  # weekly updates don't add commits to main (and, pushed with GITHUB_TOKEN,
  # don't trigger builds).
  badges:
    needs: create-manifests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update PHP version badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if git fetch -q --depth 1 origin badges 2>/dev/null; then
            git checkout -q -b badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi

          for minor in 8.5 8.4 8.3 8.2; do
            version="$(docker run --rm --pull always --entrypoint php "ghcr.io/${REPOSITORY}:php-${minor}-trixie" -r 'echo PHP_VERSION;')"
            if ! [[ "$version" =~ ^${minor//./\\.}\.[0-9]+$ ]]; then
              echo "::error::php-${minor}-trixie image reports PHP version '${version}'"
              exit 1
            fi
            printf '{"schemaVersion":1,"label":"PHP %s","message":"%s","color":"777bb4","namedLogo":"php","logoColor":"white"}\n' \
              "$minor" "$version" > "php-${minor}.json"
            echo "PHP ${minor}: ${version}"
          done

          wordpress="$(docker run --rm --pull always --entrypoint php "ghcr.io/${REPOSITORY}:php-8.4-trixie" -r 'include "/usr/src/wordpress/wp-includes/version.php"; echo $wp_version;')"
          if ! [[ "$wordpress" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::php-8.4-trixie image reports WordPress version '${wordpress}'"
            exit 1
          fi
          printf '{"schemaVersion":1,"label":"WordPress","message":"%s","color":"21759b","namedLogo":"wordpress","logoColor":"white"}\n' \
            "$wordpress" > wordpress.json
          echo "WordPress: ${wordpress}"

          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Update PHP version badges"
          git push -q origin badges
